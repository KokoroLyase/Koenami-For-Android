[versions]
agp = "9.2.1"
webkit = "1.17.1"
activity = "1.13.0"
appcompat = "1.8.0"
material = "1.14.0"
junit = "4.13.2"
testRunner = "1.7.0"
testCore = "1.7.0"
testJunit = "1.3.0"
[libraries]
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
junit = { module = "junit:junit", version.ref = "junit" }
test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
test-core = { module = "androidx.test:core", version.ref = "testCore" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "testJunit" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
